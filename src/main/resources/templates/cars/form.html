<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout::head('Cars')"></head>
<body>

<header th:replace="~{layout::header}"></header>
<h1 th:text="${car.id == null ? 'New car' : 'Edit car'}"></h1>

<form class="card" th:object="${car}" method="post"
      th:action="${car.id == null} ? @{/cars} : @{/cars/{id}(id=${car.id})}">


    <label for="make" th:text="'Make'">Make</label>
    <input id="make" type="text" th:field="*{make}"/>
    <span class="error" th:errors="*{make}"></span>

    <div th:replace="~{fragments/form-fields :: field('model','Model','text')}"></div>

    <div th:replace="~{fragments/form-fields :: field('manufactureYear','ManufactureYear','number')}"></div>

    <p>
        <button type="submit" th:text="Save"> </button>
        <a class="button" th:href="@{/cars}">Cancel</a>
    </p>
</form>
<footer th:replace="~{layout:: footer}"></footer>
</body>
</html>
