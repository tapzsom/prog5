<!DOCTYPE html>
<html lang="en">
<head th:replace="~{layout:: head('Login')}">
</head>
<body>
<header th:replace="~{layout :: header}" ></header>
<h1 th:text="'Login'"></h1>

<p class="error" th:if="${param.error}" th:text="'Login error'"></p>
<p th:if="${param.logout}" th:text="'Logged out successfully!'"></p>

<form th:action="@{/login}" method="post" class="card">
    <label for="username" th:text="'Username'"></label>
    <input type="text" id="username" name="username">

    <label for="password" th:text="'Password'"></label>
    <input type="password" id="password" name="password">

    <br>
    <br>
    <button type="submit" th:text="'Log in'"></button>

</form>

</body>
</html>
